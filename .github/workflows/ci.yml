name: CI
on:
  pull_request_target:
    types: [opened]

jobs:
  close-pr:
    if: github.actor != 'PTPAAA'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Close Pull Request
        run: |
          gh pr close ${{ github.event.pull_request.number }} --comment "Thank you for your contribution! However, to prevent spam and abuse, we automatically close all incoming PRs. Please contact admin@axenet.eu.org to be added to the whitelist."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
